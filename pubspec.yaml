name: pesao_fit
description: Superapp fitness multi-tenant para Venezuela (PESAO FIT).
publish_to: "none"
version: 0.1.0+1

environment:
  # Flutter 3.29+ (Dart 3.7+): necesario para WidgetState*, CardThemeData,
  # DialogThemeData, TabBarThemeData y Color.withValues.
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Estado (ADR-020: Riverpod codegen) ---
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # --- Navegación (ADR-024: GoRouter + StatefulShellRoute.indexedStack) ---
  go_router: ^18.0.1

  # --- Backend (ADR-002/003/014: Supabase multi-tenant con RLS) ---
  supabase_flutter: ^2.17.2

  # --- HTTP / Cloudinary upload directo unsigned (ADR-008) ---
  dio: ^5.11.1

  # --- Offline-first (ADR-012/019/033: Drift reemplaza a Isar) ---
  # Drift da soporte Web nativo (Wasm) compartiendo el 100% del código con
  # Mobile y transacciones ACID para la cola de sincronización diferida.
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1

  # --- Imágenes ---
  cached_network_image: ^4.0.0
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3

  # --- Gráficos (ADR-031: fl_chart + CustomPainter para anillos) ---
  fl_chart: ^1.2.0

  # --- Modelos (ADR-021: Freezed + json_serializable) ---
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # --- i18n (ADR-027: gen-l10n es_VE). Si flutter_localizations exige otra
  #     versión de intl, alinear esta restricción. ---
  intl: ^0.20.3

  # --- Notificaciones (ADR-007: OneSignal + fallback email) ---
  onesignal_flutter: ^5.6.10

  # --- IA (Gemini con cache; OpenAI bloquea VE) ---
  google_generative_ai: ^0.4.7

  # --- Plataforma ---
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1
  local_auth: ^3.0.2 # Biometría solo clientes/staff (ADR-011)
  vibration: ^3.2.1 # RestTimerSheet vibra al terminar
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  uuid: ^4.6.0
  flutter_dotenv: ^6.0.1
  equatable: ^2.1.0
  audioplayers: ^6.8.1
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # --- Codegen (build_runner) ---
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  drift_dev: ^2.35.0
  mocktail: ^1.0.5

  sentry_flutter: ^9.29.0

flutter:
  uses-material-design: true
  # Activa la generación automática de AppStrings desde app_es.arb.
  generate: true

  assets:
     - .env
     - assets/fonts/
     - assets/images/
     - assets/audio/ 
     
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
